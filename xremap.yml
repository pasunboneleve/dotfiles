# Credit: https://github.com/mooz/xkeysnail/blob/bf3c93b4fe6efd42893db4e6588e5ef1c4909cfb/example/config.py#L62-L125
modmap:
  - name: Homerow mods
    remap:
      a:
        held: super_l
        alone: a
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      s:
        held: shift_l
        alone: s
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      d:
        held: alt_l
        alone: d
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      f:
        held: ctrl_l
        alone: f
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      j:
        held: ctrl_r
        alone: j
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      k:
        held: alt_r
        alone: k
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      l:
        held: shift_r
        alone: l
        alone_timeout_millis: 150
        hold_threshold_millis: 250
      semicolon:
        held: super_r
        alone: semicolon
        alone_timeout_millis: 150
        hold_threshold_millis: 250

keymap:
  - name: Emacs
    application:
      not:
        - emacs
        - org.gnome.Ptyxis
        - com.mitchellh.ghostty
        - org.gnome.Terminal
        - org.remmina.Remmina
        - remmina
        - remmina-gnome
        - org.gnome.Connections
        - gnome-connections
    remap:
      # Cursor
      C-b: { with_mark: left }
      C-f: { with_mark: right }
      C-p: { with_mark: up }
      C-n: { with_mark: down }

      # Forward/Backward word
      M-b: { with_mark: C-left }
      M-f: { with_mark: C-right }
      # Beginning/End of line
      C-a: { with_mark: home }
      C-e: { with_mark: end }
      # Page up/down
      M-v: { with_mark: pageup }
      C-v: { with_mark: pagedown }
      # Webpage zoom
      C-XUPSCROLL: C-equal
      C-XDOWNSCROLL: C-minus
      # Beginning/End of file
      M-Shift-comma: { with_mark: C-home }
      M-Shift-dot: { with_mark: C-end }
      # Newline
      C-m: enter
      C-j: enter
      C-o: [enter, left]
      # Copy
      C-w: [C-x, { set_mark: false }]
      C-y: [C-v, { set_mark: false }]
      # Delete
      C-d: [delete, { set_mark: false }]
      M-d: [C-delete, { set_mark: false }]
      # Kill line
      C-k: [Shift-end, C-x, { set_mark: false }]
      # Kill word backward
      Alt-backspace: [C-backspace, {set_mark: false}]
      # set mark next word continuously.
      C-M-space: [C-Shift-right, {set_mark: true}]
      # Undo
      C-slash: [C-z, { set_mark: false }]
      C-Shift-ro: C-z
      # Mark
      C-space: { set_mark: true }
      # Search
      C-s: C-f
      C-r: Shift-F3
      M-Shift-5: C-h
      # Cancel
      C-g: [esc, { set_mark: false }]
      # C-x YYY
      C-x:
        remap:
          # C-x h (select all)
          h: [C-home, C-a, { set_mark: true }]
          # C-x C-f (open)
          C-f: C-o
          # C-x C-s (save)
          C-s: C-s
          # C-x k (kill tab)
          k: C-f4
          # C-x C-c (exit)
          C-c: C-q
          # C-x u (undo)
          u: [C-z, { set_mark: false }]
  - name: Emacs copy
    application:
      not:
        - emacs
        - org.gnome.Ptyxis
        - com.mitchellh.ghostty
        - org.gnome.Terminal
        - chromium
        - chromium-browser
        - org.chromium.Chromium
        - org.remmina.Remmina
        - remmina
        - remmina-gnome
        - org.gnome.Connections
        - gnome-connections
    remap:
      M-w: [C-c, { set_mark: false }]
